<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>草津温泉 湯畑ジオラマ</title>
<style>
  :root { --ink:#26302f; --panel:rgba(255,255,255,.82); --acc:#2f7f78; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; color:var(--ink); }
  body { background:linear-gradient(#9cc4e4 0%, #cfe3f1 55%, #eef2ea 100%); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #title { position:fixed; left:16px; top:calc(10px + env(safe-area-inset-top)); font-weight:600; letter-spacing:.06em; font-size:15px; text-shadow:0 1px 2px rgba(255,255,255,.7); pointer-events:none; }
  #title small { display:block; font-weight:400; font-size:11px; letter-spacing:.02em; opacity:.75; }
  #bar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
         padding:6px; max-width:calc(100vw - 24px); background:var(--panel); border-radius:14px; backdrop-filter:blur(8px); box-shadow:0 2px 14px rgba(0,0,0,.18); }
  button, select { font:inherit; font-size:13px; color:var(--ink); background:#fff; border:1px solid #c9d3d1; border-radius:9px; padding:7px 11px; min-height:36px; cursor:pointer; }
  button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:active { transform:scale(.97); }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; background:rgba(238,242,234,.9); transition:opacity .5s; text-align:center; padding:24px; }
  #msg.hide { opacity:0; pointer-events:none; }
  #stats { position:fixed; right:10px; top:calc(10px + env(safe-area-inset-top)); font:11px/1.4 ui-monospace,monospace; background:var(--panel); padding:6px 8px; border-radius:8px; white-space:pre; display:none; }
  #credit { position:fixed; right:10px; bottom:calc(4px + env(safe-area-inset-bottom)); font-size:10px; opacity:.55; pointer-events:none; }
  @media (max-width:560px) { #credit { display:none; } #title { font-size:14px; }
    #bar { flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; width:calc(100vw - 16px); max-width:none; border-radius:12px; }
    button, select { white-space:nowrap; flex:none; padding:7px 9px; font-size:12px; } }
</style>
</head>
<body>
<div id="title">草津温泉 湯畑ジオラマ<small>半径200 m・実測の標高 1:1(静止)</small></div>
<div id="bar">
  <button data-view="all" class="on">全景</button>
  <button data-view="yubatake">湯畑</button>
  <button data-view="yutaki">湯滝</button>
  <button data-view="yutoi">湯樋</button>
  <button data-view="stairs">光泉寺の石段</button>
  <button data-view="nishi">西の河原通り</button>
  <button id="bld">建物:表示</button>
  <button id="spin">自動で回る</button>
  <select id="quality" aria-label="画質"><option value="standard">画質:標準</option><option value="light">画質:軽量</option></select>
</div>
<div id="msg">読み込み中…</div>
<div id="stats"></div>
<div id="credit">地図: OpenStreetMap contributors / 標高: 国土地理院</div>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
<script type="module" src="./app.js?v=7"></script>
</body>
</html>
