<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シンデレラ城(2D 立面図)</title>
<style>
:root{--ink:#1E2A30;--muted:#66747C;--sheet:#F8FAF8;--rule:#D3DBD6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;font:13px/1.5 "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
.panel{position:fixed;left:10px;top:10px;width:300px;max-width:calc(100vw - 20px);max-height:calc(100vh - 20px);overflow:auto;background:rgba(248,250,248,.93);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.panel h1{margin:0 0 4px;font-size:14px}
.panel h2{margin:8px 0 2px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.panel p{margin:2px 0;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}
button{font:inherit;font-size:12px;height:28px;padding:0 10px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--muted)}
button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.spec{position:fixed;right:10px;bottom:10px;max-width:380px;background:rgba(248,250,248,.9);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:11.5px;color:var(--muted)}
.spec b{color:var(--ink);font-weight:500}
body.clean .panel,body.clean .spec{display:none}
@media (max-width:700px){.spec{display:none}.panel{width:auto;right:10px}.panel p.long{display:none}}
</style>
<canvas id="c"></canvas>
<div class="panel">
  <h1>シンデレラ城(2D 立面図)</h1>
  <p class="long">東京ディズニーランドのシンデレラ城を、正面(ワールドバザール側)から見た 2D の絵。canvas だけで描いていて、画像ファイルは使っていない。</p>
  <h2>時間帯</h2><div class="row" id="modes"></div>
  <h2>表示</h2>
  <div class="row"><button id="dims" aria-pressed="false">寸法線</button><button id="refl" aria-pressed="true">水面の映り込み</button><button id="save">PNG で保存</button></div>
</div>
<div class="spec">
  <b>実測</b>(OSM): 高さ 51 m、建物の幅 約 36 m(東西)<br>
  <b>写真から読み取った形</b>: 岩の土台と堀、灰色の石積みの城壁と胸壁、尖頭アーチの通り抜けと橋、白い上部の城と大広間の尖頭窓、青い円すい屋根と金の帯・頂部飾り、中央の尖塔と左右で高さの違う塔<br>
  <b>推定</b>: 各塔の位置・太さ・高さ、窓の数と大きさ、城壁の長さ
</div>
<script>
'use strict';
// World units are metres: x = 0 at the centre of the archway (+x to the right, facing the castle),
// y = 0 at the plaza level, up is +y. The waterline of the moat is at WATER.
const WATER = -0.6, TOP = 51;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, CX = 0, GY = 0;
const sx = x => CX + x * S, sy = y => GY - y * S;

// Two seeded random streams: rg for shapes (identical in every pass), rt for surface texture
// (skipped in the emission pass, so it must not shift the shapes).
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rg, rt;

const P = {
  stone: '#b3ab9d', stoneT: '#bab2a4', rock: '#83796b', white: '#f0ece5', trim: '#ddd4c3',
  roofL: '#6590db', roof: '#2d59ab', roofD: '#152d68', gold: '#d8b04a', goldL: '#f6dd8e', goldD: '#8e6a1f',
  glass: '#26303e', leaf: '#4b7a3c', leafL: '#86ad5a', leafD: '#1f3c20',
};

// ---- colour helpers --------------------------------------------------------------------------------
function rgb(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function sh(c, t) { const f = v => Math.max(0, Math.min(255, Math.round(t >= 0 ? v + (255 - v) * t : v * (1 + t)))); const [r, g, b] = rgb(c); return `rgb(${f(r)},${f(g)},${f(b)})`; }
let g, EM = false;                 // g = the layer being drawn; EM = emission pass (everything black but lit windows)
const C = c => EM ? '#000' : c;
function LG(x0, y0, x1, y1, stops) { if (EM) return '#000'; const q = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => q.addColorStop(o, c)); return q; }
function RG(x, y, r0, r1, stops) { if (EM) return '#000'; const q = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => q.addColorStop(o, c)); return q; }
function fillRect(x0, y0, x1, y1, f) { g.fillStyle = f; g.fillRect(sx(x0), sy(y1), (x1 - x0) * S, (y1 - y0) * S); }
// Light comes from the upper left: a cylinder is brightest a third of the way across.
const cylShade = (x, r, k = 1) => LG(sx(x - r), 0, sx(x + r), 0, [[0, `rgba(0,0,0,${.14 * k})`], [.3, `rgba(255,255,255,${.16 * k})`], [.55, 'rgba(0,0,0,0)'], [.85, `rgba(0,0,0,${.22 * k})`], [1, `rgba(0,0,0,${.38 * k})`]]);

// ---- masonry -------------------------------------------------------------------------------------
function ashlar(x0, y0, x1, y1, base, ch, jit) {
  if (EM || S < 3) return;
  const pad = Math.min(.6, S * .06);
  for (let y = y0, row = 0; y < y1; y += ch, row++) {
    let x = x0 - rt() * 1.3;
    while (x < x1) {
      const w = .8 + rt() * 1.1;
      g.fillStyle = sh(base, (rt() - .5) * jit);
      g.fillRect(sx(x) + pad, sy(Math.min(y + ch, y1)) + pad, w * S - pad * 2, Math.min(ch, y1 - y) * S - pad * 2);
      x += w;
    }
  }
}
function wall(x0, y0, x1, y1, base = P.stone, o = {}) {
  g.save(); g.beginPath(); g.rect(sx(x0), sy(y1), (x1 - x0) * S, (y1 - y0) * S); g.clip();
  g.fillStyle = C(sh(base, -.22)); g.fillRect(sx(x0), sy(y1), (x1 - x0) * S, (y1 - y0) * S);
  if (EM || S < 3) { g.fillStyle = C(base); g.fillRect(sx(x0), sy(y1), (x1 - x0) * S, (y1 - y0) * S); }
  ashlar(x0, y0, x1, y1, base, o.ch || .55, o.jit || .12);
  // Soft darkening towards the ground and under the parapet.
  g.fillStyle = LG(0, sy(y1), 0, sy(y0), [[0, 'rgba(0,0,0,.10)'], [.12, 'rgba(0,0,0,0)'], [.75, 'rgba(0,0,0,0)'], [1, 'rgba(40,30,20,.18)']]);
  g.fillRect(sx(x0), sy(y1), (x1 - x0) * S, (y1 - y0) * S);
  g.restore();
}
function cyl(x, r, y0, y1, base = P.stoneT, o = {}) {
  const L = sx(x - r), T = sy(y1), w = 2 * r * S, h = (y1 - y0) * S;
  g.save(); g.beginPath(); g.rect(L, T, w, h); g.clip();
  g.fillStyle = C(o.smooth ? base : sh(base, -.2)); g.fillRect(L, T, w, h);
  if (!EM && S >= 3) {
    const ch = o.smooth ? 1.1 : .55, pad = Math.min(.6, S * .06);
    for (let y = y0, row = 0; y < y1; y += ch, row++) {
      if (o.smooth) { g.fillStyle = 'rgba(120,110,95,.12)'; g.fillRect(L, sy(y) - .5, w, .8); continue; }
      const step = 1.2 / r; let a = -Math.PI / 2 + (row % 2) * step / 2 - step;
      while (a < Math.PI / 2) {
        const a1 = Math.min(a + step, Math.PI / 2), xa = x + r * Math.sin(Math.max(a, -Math.PI / 2)), xb = x + r * Math.sin(a1);
        g.fillStyle = sh(base, (rt() - .5) * .12);
        g.fillRect(sx(xa) + pad * .6, sy(Math.min(y + ch, y1)) + pad, (xb - xa) * S - pad * 1.2, ch * S - pad * 2);
        a = a1;
      }
    }
  }
  g.fillStyle = cylShade(x, r, o.smooth ? .8 : 1); g.fillRect(L, T, w, h);
  if (o.eave) { g.fillStyle = LG(0, T, 0, T + 1.4 * S, [[0, 'rgba(0,0,30,.35)'], [1, 'rgba(0,0,30,0)']]); g.fillRect(L, T, w, 1.4 * S); }
  g.restore();
}
// Merlons along a flat wall top.
function crenel(x0, x1, y, h = 1.05, mw = .95, gw = .7, base = P.stone) {
  const n = Math.max(1, Math.round((x1 - x0 + gw) / (mw + gw))), sp = (x1 - x0 - n * mw) / Math.max(1, n - 1);
  for (let i = 0; i < n; i++) { const a = x0 + i * (mw + sp); wall(a, y, a + mw, y + h, base, { ch: .5 }); fillRect(a, y + h - .12, a + mw, y + h, C(sh(base, .18))); }
}
// Merlons on a round parapet: narrower towards the edges.
function crenelRound(x, r, y, h = 1.05, base = P.stoneT) {
  const n = Math.max(4, Math.round(r * 2.2));
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + (i + .15) * Math.PI / n, a1 = -Math.PI / 2 + (i + .75) * Math.PI / n;
    const xa = x + r * Math.sin(a0), xb = x + r * Math.sin(a1), lit = Math.cos((a0 + a1) / 2 + .6);
    fillRect(xa, y, xb, y + h, C(sh(base, lit > 0 ? lit * .12 : lit * .35)));
    fillRect(xa, y + h - .12, xb, y + h, C(sh(base, .2)));
  }
}
// Projecting parapet carried on corbels (machicolations).
function machicolate(x0, x1, y, base = P.stone, round = 0) {
  const n = Math.max(3, Math.round((x1 - x0) / .9));
  fillRect(x0 + .2, y - .75, x1 - .2, y, C(sh(base, -.45)));
  for (let i = 0; i < n; i++) {
    const cx = x0 + (i + .5) * (x1 - x0) / n, w = (x1 - x0) / n * .42;
    g.fillStyle = C(sh(base, round ? -.1 * Math.abs((cx - (x0 + x1) / 2) / ((x1 - x0) / 2)) : 0));
    g.beginPath(); g.moveTo(sx(cx - w), sy(y)); g.lineTo(sx(cx + w), sy(y)); g.lineTo(sx(cx + w * .45), sy(y - .75)); g.lineTo(sx(cx - w * .45), sy(y - .75)); g.fill();
  }
}

// ---- roofs ---------------------------------------------------------------------------------------
function coneRoof(x, r, yb, yt, o = {}) {
  const fl = r * 1.15, hh = yt - yb, dip = fl * .2;
  const path = () => {
    g.beginPath(); g.moveTo(sx(x - fl), sy(yb));
    g.quadraticCurveTo(sx(x - r * .5), sy(yb + hh * .3), sx(x), sy(yt));
    g.quadraticCurveTo(sx(x + r * .5), sy(yb + hh * .3), sx(x + fl), sy(yb));
    g.quadraticCurveTo(sx(x), sy(yb - dip * 2), sx(x - fl), sy(yb)); g.closePath();
  };
  path(); g.fillStyle = LG(sx(x - fl), 0, sx(x + fl), 0, [[0, sh(P.roof, .05)], [.28, P.roofL], [.55, P.roof], [1, P.roofD]]); g.fill();
  if (!EM && S >= 3) {
    g.save(); path(); g.clip(); g.lineWidth = Math.max(.5, S * .045);
    for (let y = yb; y < yt; y += .34) {            // shingle courses, bowed to read as round
      const rr = fl * (1 - (y - yb) / hh) * 1.02;
      g.strokeStyle = 'rgba(8,20,60,.28)'; g.beginPath(); g.moveTo(sx(x - rr), sy(y)); g.quadraticCurveTo(sx(x), sy(y - rr * .4), sx(x + rr), sy(y)); g.stroke();
    }
    for (let a = -1.3; a <= 1.31; a += .26) {       // seams from the tip
      g.strokeStyle = a < 0 ? 'rgba(255,255,255,.08)' : 'rgba(0,0,40,.12)';
      g.beginPath(); g.moveTo(sx(x), sy(yt)); g.lineTo(sx(x + fl * Math.sin(a)), sy(yb - dip * Math.cos(a))); g.stroke();
    }
    g.restore();
  }
  goldRing(x, fl * 1.01, yb - .05, .38, dip);
  if (o.band) { const yy = yb + hh * o.band, rr = fl * (1 - o.band) * .98; goldRing(x, rr, yy, .28, rr * .2); }
  finial(x, yt, o.fin ?? Math.max(.9, r * .55), o.fancy);
}
function goldRing(x, r, y, h, dip) {
  g.beginPath(); g.moveTo(sx(x - r), sy(y)); g.quadraticCurveTo(sx(x), sy(y - dip * 2), sx(x + r), sy(y));
  g.lineTo(sx(x + r), sy(y + h)); g.quadraticCurveTo(sx(x), sy(y + h - dip * 2), sx(x - r), sy(y + h)); g.closePath();
  g.fillStyle = LG(sx(x - r), 0, sx(x + r), 0, [[0, P.gold], [.3, P.goldL], [.6, P.gold], [1, P.goldD]]); g.fill();
}
function finial(x, y, len, fancy) {
  const gf = w => LG(sx(x - w), 0, sx(x + w), 0, [[0, P.gold], [.35, P.goldL], [1, P.goldD]]);
  const ball = (yy, r) => { g.fillStyle = gf(r); g.beginPath(); g.arc(sx(x), sy(yy), r * S, 0, 7); g.fill(); };
  if (fancy) {
    ball(y + .05, .32); g.fillStyle = gf(.2); g.fillRect(sx(x - .09), sy(y + .75), .18 * S, .6 * S);
    ball(y + .8, .22); ball(y + 1.18, .14);
  } else ball(y + .08, Math.max(.13, len * .16));
  g.fillStyle = gf(.1); g.beginPath(); g.moveTo(sx(x - .07), sy(y + (fancy ? 1.2 : .2))); g.lineTo(sx(x + .07), sy(y + (fancy ? 1.2 : .2))); g.lineTo(sx(x), sy(y + len)); g.fill();
}
// A hipped roof in elevation: a trapezoid with gold cresting on the ridge.
function hipRoof(x0, x1, yb, yt, inset) {
  const path = () => { g.beginPath(); g.moveTo(sx(x0), sy(yb)); g.lineTo(sx(x0 + inset), sy(yt)); g.lineTo(sx(x1 - inset), sy(yt)); g.lineTo(sx(x1), sy(yb)); g.closePath(); };
  path(); g.fillStyle = LG(0, sy(yt), 0, sy(yb), [[0, P.roofL], [1, P.roof]]); g.fill();
  // The hipped ends turn away from the light (left end lit, right end in shade).
  g.fillStyle = C('rgba(255,255,255,.10)'); g.beginPath(); g.moveTo(sx(x0), sy(yb)); g.lineTo(sx(x0 + inset), sy(yt)); g.lineTo(sx(x0 + inset * 1.25), sy(yb)); g.fill();
  g.fillStyle = C('rgba(0,0,40,.35)'); g.beginPath(); g.moveTo(sx(x1), sy(yb)); g.lineTo(sx(x1 - inset), sy(yt)); g.lineTo(sx(x1 - inset * 1.25), sy(yb)); g.fill();
  if (!EM && S >= 3) { g.save(); path(); g.clip(); g.strokeStyle = 'rgba(8,20,60,.25)'; g.lineWidth = Math.max(.5, S * .045); for (let y = yb + .34; y < yt; y += .34) { g.beginPath(); g.moveTo(sx(x0), sy(y)); g.lineTo(sx(x1), sy(y)); g.stroke(); } g.restore(); }
  fillRect(x0 - .1, yb - .1, x1 + .1, yb + .25, LG(sx(x0), 0, sx(x1), 0, [[0, P.gold], [.4, P.goldL], [1, P.goldD]]));
  fillRect(x0 + inset, yt, x1 - inset, yt + .22, C(P.gold));
  for (let x = x0 + inset; x <= x1 - inset + .01; x += .55) { g.fillStyle = C(P.gold); g.beginPath(); g.moveTo(sx(x - .1), sy(yt + .2)); g.lineTo(sx(x + .1), sy(yt + .2)); g.lineTo(sx(x), sy(yt + .75)); g.fill(); }
  finial(x0 + inset, yt + .2, 1.3); finial(x1 - inset, yt + .2, 1.3);
}
function dormer(x, y, w, h) {
  fillRect(x - w / 2, y, x + w / 2, y + h, LG(sx(x - w / 2), 0, sx(x + w / 2), 0, [[0, P.white], [1, sh(P.white, -.2)]]));
  win(x, y + .15, w * .55, h * .8, 'round');
  g.fillStyle = LG(sx(x - w / 2), 0, sx(x + w / 2), 0, [[0, P.roofL], [1, P.roofD]]);
  g.beginPath(); g.moveTo(sx(x - w / 2 - .15), sy(y + h)); g.lineTo(sx(x), sy(y + h + w * .95)); g.lineTo(sx(x + w / 2 + .15), sy(y + h)); g.fill();
  finial(x, y + h + w * .95, .6);
}

// ---- windows -------------------------------------------------------------------------------------
function winPath(x, y0, w, h, type) {
  const L = sx(x - w / 2), R = sx(x + w / 2), B = sy(y0);
  g.beginPath();
  if (type === 'slit') { g.rect(L, sy(y0 + h), R - L, B - sy(y0 + h)); return; }
  const ah = type === 'round' ? w / 2 : w * .85, ys = y0 + h - ah;
  g.moveTo(L, B); g.lineTo(L, sy(ys));
  if (type === 'round') g.arc(sx(x), sy(ys), w / 2 * S, Math.PI, 0);
  else { g.quadraticCurveTo(L, sy(ys + ah * .62), sx(x), sy(y0 + h)); g.quadraticCurveTo(R, sy(ys + ah * .62), R, sy(ys)); }
  g.lineTo(R, B); g.closePath();
}
function win(x, y0, w, h, type = 'lancet', frame = P.trim) {
  if (type !== 'slit') { winPath(x, y0 - .12, w + .34, h + .26, type); g.fillStyle = C(frame); g.fill(); }
  winPath(x, y0, w, h, type);
  if (EM) {
    // Lit windows glow warm; arrow slits stay mostly dark. The level is fixed per window.
    const k = type === 'slit' ? .25 : .55 + .45 * ((Math.sin(x * 12.9898 + y0 * 78.233) * 43758.5453) % 1 + 1) % 1;
    g.fillStyle = `rgba(255,${190 + 30 * k | 0},${110 + 40 * k | 0},${k})`;
  } else g.fillStyle = LG(0, sy(y0 + h), 0, sy(y0), [[0, '#1b222d'], [.55, P.glass], [1, '#4a5669']]);
  g.fill();
  if (!EM && S >= 3 && type !== 'slit') {
    g.strokeStyle = 'rgba(210,200,185,.85)'; g.lineWidth = Math.max(.6, S * .06);
    if (w > 1) { g.beginPath(); g.moveTo(sx(x), sy(y0)); g.lineTo(sx(x), sy(y0 + h - w * .45)); g.stroke(); }
    if (h > 2.2) { g.beginPath(); g.moveTo(sx(x - w / 2), sy(y0 + h * .42)); g.lineTo(sx(x + w / 2), sy(y0 + h * .42)); g.stroke(); }
    if (w > 1.3 && type === 'lancet') { g.beginPath(); g.arc(sx(x), sy(y0 + h - w * .42), w * .2 * S, 0, 7); g.stroke(); }
  }
  if (type !== 'slit') fillRect(x - w / 2 - .25, y0 - .3, x + w / 2 + .25, y0 - .1, C(sh(frame, -.08)));
}

// ---- parts of the castle ---------------------------------------------------------------------------
function whiteTower(x, r, y0, y1, ytip, o = {}) {
  cyl(x, r, y0, y1, P.white, { smooth: true, eave: true });
  fillRect(x - r - .08, y1 - .45, x + r + .08, y1, C(P.trim));
  fillRect(x - r - .08, y1 - .45, x + r + .08, y1, cylShade(x, r, .9));
  const n = o.windows ?? Math.max(1, Math.floor((y1 - y0 - 2) / 5));
  for (let i = 0; i < n; i++) { const yy = y0 + 2 + i * (y1 - y0 - 3) / n; win(x, yy, Math.min(.9, r * .55), Math.min(2.4, (y1 - y0 - 3) / n * .55), i === n - 1 ? 'lancet' : 'round'); }
  coneRoof(x, r, y1, ytip, o);
}
function stoneTower(x, r, y0, y1, o = {}) {
  cyl(x, r, y0, y1, P.stoneT, { eave: !!o.roof });
  (o.slits || []).forEach(y => win(x - r * .15, y, .28, 1.2, 'slit'));
  machicolate(x - r - .3, x + r + .3, y1 - .9, P.stoneT, 1);
  cyl(x, r + .3, y1 - .9, y1, P.stoneT);
  if (o.roof) coneRoof(x, r + .25, y1, o.roof, { band: .5 });
  else crenelRound(x, r + .3, y1);
}
function bartizan(x, y0, y1, ytip, r = .8) {
  g.fillStyle = C(P.stoneT);
  g.beginPath(); g.moveTo(sx(x - r), sy(y0)); g.lineTo(sx(x + r), sy(y0)); g.lineTo(sx(x), sy(y0 - 1.6)); g.fill();
  g.fillStyle = cylShade(x, r); g.beginPath(); g.moveTo(sx(x - r), sy(y0)); g.lineTo(sx(x + r), sy(y0)); g.lineTo(sx(x), sy(y0 - 1.6)); g.fill();
  cyl(x, r, y0, y1, P.white, { smooth: true, eave: true });
  win(x, y0 + .5, .3, 1, 'slit');
  coneRoof(x, r, y1, ytip);
}
function thinSpire(x, r, y0, y1, ytip) { cyl(x, r, y0, y1, P.white, { smooth: true, eave: true }); win(x, y1 - 3, r * .6, 1.8, 'lancet'); coneRoof(x, r, y1, ytip, { fin: 1.1 }); }

function mainTower() {
  wall(-3.4, 27, 3.4, 41, P.white, { ch: 1.1, jit: .03 });
  win(-1.25, 35.3, 1.05, 4.3); win(1.25, 35.3, 1.05, 4.3);
  win(0, 40.1, .9, .7, 'round');

function resize() {

const modesEl = document.getElementById('modes');
