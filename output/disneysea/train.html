<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ディズニーリゾートライン 電車モデル(JS 版の試作)</title>
<style>
:root{--ink:#1E2A30;--muted:#66747C;--sheet:#F8FAF8;--rule:#D3DBD6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ee;font:13px/1.5 "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0}
#c canvas{display:block;width:100%;height:100%}
.panel{position:fixed;left:10px;top:10px;max-width:330px;background:rgba(248,250,248,.92);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.panel h1{margin:0 0 4px;font-size:14px}
.panel p{margin:2px 0;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
button{font:inherit;font-size:12px;height:28px;padding:0 10px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--muted)}
button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.spec{position:fixed;right:10px;bottom:10px;max-width:360px;background:rgba(248,250,248,.9);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:11.5px;color:var(--muted)}
.spec b{color:var(--ink);font-weight:500}
.mono{font-family:ui-monospace,Consolas,monospace}
@media (max-width:640px){.spec{display:none}.panel{max-width:calc(100vw - 20px)}}
</style>
<div id="c"></div>
<div class="panel">
  <h1>ディズニーリゾートライン 電車モデル</h1>
  <p>JS(three.js)だけで作った試作。Type X(初代)の青い 6 両編成。</p>
  <div class="row" id="views"></div>
  <div class="row"><button id="run" aria-pressed="false">走らせる</button><button id="wire" aria-pressed="false">ワイヤー</button><button id="orbit" aria-pressed="false">自動で回る</button></div>
  <p class="mono" id="stats"></p>
</div>
<div class="spec">
  <b>寸法</b>(Wikipedia「舞浜リゾートライン」): 先頭車 15.05 m ・ 中間車 13.70 m ・ 全幅 2.98 m ・ 全高 5.237 m ・ 6 両編成<br>
  <b>推定</b>(公開情報になく、写真から見当をつけた値): 車体の色・窓の大きさと配置・ドアの位置・桁の寸法・台車・屋根の機器・先頭部の曲面
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const T = window.THREE, $ = id => document.getElementById(id);

/* ---------- spec (m) ---------- */
const SPEC = {
  headLen: 15.05, midLen: 13.70, width: 2.98, gap: 0.55, cars: 6,        // Wikipedia
  noseLen: 3.4, bodyBottom: 0.62, bodyTop: 3.95, roofR: 1.15,             // estimates
  beamW: 0.85, beamH: 1.4, pillarEvery: 30, pillarH: 8.0,                 // estimates (straddle-type beam)
  color: { body: 0x1c6fcf, roof: 0xdfe6ee, skirt: 0x56626e, glass: 0x172433, door: 0x1f5f9e },
};
const W = SPEC.width;
const t0 = performance.now();

/* ---------- renderer / scene ---------- */
const host = $("c");
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new T.Scene();
const cam = new T.PerspectiveCamera(34, 1, 0.1, 4000);
const ctl = new T.OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.499;

// sky: gradient dome -> PMREM environment (reflections) + background
{
  const sc = new T.Scene();
  sc.add(new T.Mesh(new T.SphereGeometry(500, 32, 16), new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false,
    vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: "varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 hor = vec3(.86,.91,.95), top = vec3(.28,.50,.82), gnd = vec3(.42,.47,.40); vec3 c = h > 0. ? mix(hor, top, pow(h,.55)) : mix(hor, gnd, min(1.,-h*4.)); gl_FragColor = vec4(c,1.); }" })));
  const sun = new T.Mesh(new T.SphereGeometry(28, 16, 8), new T.MeshBasicMaterial({ color: new T.Color(14, 13, 11) }));
  sun.position.set(-260, 340, 220); sc.add(sun);
  const pm = new T.PMREMGenerator(renderer), env = pm.fromScene(sc, 0.02).texture; pm.dispose();
  scene.environment = env;
  scene.add(new T.Mesh(new T.SphereGeometry(1800, 32, 16), new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: "varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 hor = vec3(.80,.87,.93), top = vec3(.36,.58,.86); gl_FragColor = vec4(mix(hor, top, pow(clamp(h,0.,1.),.5)), 1.); }" })));
}
scene.fog = new T.Fog(0xcfdde9, 300, 1600);
const sunL = new T.DirectionalLight(0xfff2dc, 1.7); sunL.position.set(-120, 170, 110);
sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048);
Object.assign(sunL.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 500 }); sunL.shadow.bias = -0.0004;
scene.add(sunL, sunL.target); scene.add(new T.HemisphereLight(0xdfe9f3, 0x687058, 0.5));

/* ---------- materials ---------- */
const M = {
  paint: new T.MeshPhysicalMaterial({ color: SPEC.color.body, roughness: 0.38, metalness: 0.15, clearcoat: 0.8, clearcoatRoughness: 0.12 }),
  glass: new T.MeshPhysicalMaterial({ color: SPEC.color.glass, roughness: 0.06, metalness: 0.3, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.6 }),
  roof: new T.MeshStandardMaterial({ color: SPEC.color.roof, roughness: 0.6, metalness: 0.1 }),
  skirt: new T.MeshStandardMaterial({ color: SPEC.color.skirt, roughness: 0.55, metalness: 0.4 }),
  door: new T.MeshPhysicalMaterial({ color: SPEC.color.door, roughness: 0.4, metalness: 0.15, clearcoat: 0.5 }),
  dark: new T.MeshStandardMaterial({ color: 0x1b1e22, roughness: 0.7, metalness: 0.3 }),
  rubber: new T.MeshStandardMaterial({ color: 0x141414, roughness: 0.95 }),
  metal: new T.MeshStandardMaterial({ color: 0x9aa3ab, roughness: 0.35, metalness: 0.9 }),
  lamp: new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2c0, emissiveIntensity: 2.2 }),
  sign: new T.MeshStandardMaterial({ color: 0x331a00, emissive: 0xff8a1e, emissiveIntensity: 1.6 }),
  concrete: new T.MeshStandardMaterial({ color: 0x9c9a94, roughness: 0.92 }),
  ground: new T.MeshStandardMaterial({ color: 0x5d6d4e, roughness: 1 }),
};

/* ---------- geometry helpers ---------- */
// rounded rectangle cross-section (z lateral, y up): big roof radius, small bottom radius
function section(w, y0, y1, rt, rb, n = 8) {
  const pts = [], hw = w / 2;
  rt = Math.min(rt, hw, (y1 - y0) / 2); rb = Math.min(rb, hw, (y1 - y0) / 2);
  const arc = (cz, cy, r, a0, a1) => { for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cz + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  arc(hw - rt, y1 - rt, rt, 0, Math.PI / 2);            // top right -> top left
  arc(-hw + rt, y1 - rt, rt, Math.PI / 2, Math.PI);
  arc(-hw + rb, y0 + rb, rb, Math.PI, 1.5 * Math.PI);   // bottom left
  arc(hw - rb, y0 + rb, rb, 1.5 * Math.PI, 2 * Math.PI);
  return pts;
}
const smooth = t => t * t * (3 - 2 * t);
// car body: sections along x in [0, L]; a nose tapers the end(s). Returns geometry with 2 groups: 0 = paint, 1 = windscreen glass
function carBody(L, noseFront, noseRear) {
  const secs = [], y0 = SPEC.bodyBottom, y1 = SPEC.bodyTop, Ln = SPEC.noseLen;
  const noseAt = (t) => ({ w: W * (0.62 + 0.38 * Math.sqrt(Math.max(0, 1 - t * t))), top: y1 - 0.95 * Math.pow(t, 2.1), bot: y0 + 0.32 * Math.pow(t, 2.6), rt: SPEC.roofR * (1 - 0.35 * t) });
  const N = 14;
  const push = (x, s) => secs.push({ x, pts: section(s.w, s.bot, s.top, s.rt, 0.18, 8), t: s.t ?? 0 });
  const full = { w: W, top: y1, bot: y0, rt: SPEC.roofR };
  if (noseRear) for (let i = N; i >= 1; i--) { const t = Math.pow(i / N, 0.9); push(Ln * (1 - t) * 1, { ...noseAt(t), t: -t }); }
  push(noseRear ? Ln : 0, { ...full, t: 0 }); push(noseFront ? L - Ln : L, { ...full, t: 0 });
  if (noseFront) for (let i = 1; i <= N; i++) { const t = Math.pow(i / N, 0.9); push(L - Ln + Ln * t, { ...noseAt(t), t }); }
  secs.sort((a, b) => a.x - b.x);
  const P = secs[0].pts.length, pos = [], idx = [], groups = [[], []];
  secs.forEach(s => s.pts.forEach(([z, y]) => pos.push(s.x, y, z)));
  const glassZone = (cx, cy, cz, s) => {
    const t = Math.abs(s.t); if (t < 0.12 || t > 0.97) return false;
    const a = noseAt(t); return cy > 1.85 && cy < a.top - 0.3 && Math.abs(cz) < a.w / 2 - 0.3;
  };
  for (let s = 0; s < secs.length - 1; s++) for (let p = 0; p < P; p++) {
    const q = (p + 1) % P, a = s * P + p, b = s * P + q, c = (s + 1) * P + q, d = (s + 1) * P + p;
    const cx = (pos[a * 3] + pos[c * 3]) / 2, cy = (pos[a * 3 + 1] + pos[c * 3 + 1]) / 2, cz = (pos[a * 3 + 2] + pos[c * 3 + 2]) / 2;
    const g = glassZone(cx, cy, cz, secs[secs[s].t !== 0 ? s : s + 1]) ? 1 : 0;
    groups[g].push(a, b, c, a, c, d);
  }
  // end caps (fan)
  const cap = (s, flip) => {
    const ci = pos.length / 3, sec = secs[s]; let cy = 0; sec.pts.forEach(p => cy += p[1]); pos.push(sec.x, cy / P, 0);
    for (let p = 0; p < P; p++) { const a = s * P + p, b = s * P + (p + 1) % P; groups[0].push(...(flip ? [ci, b, a] : [ci, a, b])); }
  };
  cap(0, true); cap(secs.length - 1, false);
  // orient triangles outward: the first side triangle starts on the right-hand wall (+z), so its normal must point to +z
  const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
  g.setIndex(groups[0].concat(groups[1]));
  g.addGroup(0, groups[0].length, 0); g.addGroup(groups[0].length, groups[1].length, 1);
  {
    const A = new T.Vector3().fromArray(pos, groups[0][0] * 3), B = new T.Vector3().fromArray(pos, groups[0][1] * 3), C = new T.Vector3().fromArray(pos, groups[0][2] * 3);
    const n = B.sub(A).cross(C.sub(A));
    if (n.z < 0) { const arr = g.index.array; for (let i = 0; i < arr.length; i += 3) { const t = arr[i + 1]; arr[i + 1] = arr[i + 2]; arr[i + 2] = t; } }
  }
  g.computeVertexNormals();
  return g;
}
// Mickey head (large circle + two ears) as a flat shape
function mickeyShape(r = 0.58, er = 0.31, ex = 0.52, ey = 0.66) {
  const s = new T.Shape(); s.absarc(0, 0, r, 0, Math.PI * 2, false);
  const e1 = new T.Path(); e1.absarc(-ex, ey, er, 0, Math.PI * 2, false);
  return [s, [-ex, ey, er], [ex, ey, er]];
}
const mickeyGeo = (() => {
  const geos = [new T.CircleGeometry(0.58, 40), ...[-1, 1].map(k => { const g = new T.CircleGeometry(0.31, 28); g.translate(k * 0.52, 0.66, 0); return g; })];
  const pos = [], idx = []; let off = 0;
  geos.forEach(g => { const p = g.attributes.position.array; for (let i = 0; i < p.length; i++) pos.push(p[i]); g.index.array.forEach(i => idx.push(i + off)); off += p.length / 3; });
  const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
})();
const box = (w, h, d, mat, x, y, z, parent) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; };
const cyl = (r, h, mat, x, y, z, axis, parent) => { const m = new T.Mesh(new T.CylinderGeometry(r, r, h, 20), mat); m.position.set(x, y, z); if (axis === "z") m.rotation.x = Math.PI / 2; m.castShadow = true; parent.add(m); return m; };

/* ---------- one car ---------- */
function buildCar(L, noseFront, noseRear) {
  const car = new T.Group();
  const body = new T.Mesh(carBody(L, noseFront, noseRear), [M.paint, M.glass]); body.castShadow = true; body.receiveShadow = true; car.add(body);
  const x0 = noseRear ? SPEC.noseLen : 0, x1 = noseFront ? L - SPEC.noseLen : L, side = [-1, 1], yWin = 2.6;
  // roof cap, AC units, skirts, bogies
  const roofLen = x1 - x0 + (noseFront ? SPEC.noseLen * 0.55 : 0) + (noseRear ? SPEC.noseLen * 0.55 : 0);
  const rc = box(roofLen - 0.6, 0.06, W * 0.46, M.roof, (x0 + x1) / 2 + (noseFront ? SPEC.noseLen * 0.27 : 0) - (noseRear ? SPEC.noseLen * 0.27 : 0), SPEC.bodyTop + 0.005, 0, car);
  for (const ax of [x0 + 2.2, (x0 + x1) / 2 + 1.4, x1 - 2.2]) box(1.7, 0.32, 1.1, M.roof, ax, SPEC.bodyTop + 0.2, 0, car);
  side.forEach(s => {
    box(L - 1.2, 0.85, 0.07, M.skirt, L / 2, 0.2, s * (W / 2 - 0.2), car);
    // Mickey windows and doors on the flat side wall
    const span = x1 - x0, doorW = 1.3, doorX = [x0 + 1.9, x1 - 1.9], usable0 = doorX[0] + doorW / 2 + 0.75, usable1 = doorX[1] - doorW / 2 - 0.75;
    doorX.forEach(dx => {
      const dz = s * (W / 2 + 0.012), rot = s > 0 ? 0 : Math.PI;
      const panel = new T.Mesh(new T.PlaneGeometry(doorW, 2.55), M.door); panel.position.set(dx, 2.05, dz); panel.rotation.y = rot; car.add(panel);
      const seam = new T.Mesh(new T.PlaneGeometry(0.03, 2.55), M.dark); seam.position.set(dx, 2.05, dz + s * 0.002); seam.rotation.y = rot; car.add(seam);
      [-1, 1].forEach(k => { const w = new T.Mesh(new T.PlaneGeometry(0.42, 1.0), M.glass); w.position.set(dx + k * 0.31, 2.35, dz + s * 0.004); w.rotation.y = rot; car.add(w); });
    });
    const n = Math.max(1, Math.floor((usable1 - usable0) / 2.6)), step = (usable1 - usable0) / n;
    for (let i = 0; i < n; i++) {
      const wx = usable0 + step * (i + 0.5), m = new T.Mesh(mickeyGeo, M.glass);
      m.position.set(wx, yWin - 0.05, s * (W / 2 + 0.012)); m.rotation.y = s > 0 ? 0 : Math.PI; car.add(m);
    }
  });
  [2.7, L - 2.7].forEach(bx => {    // bogies: side frames, guide wheels (visible under the skirt), running tyres on the beam
    side.forEach(s => {
      box(2.6, 0.55, 0.22, M.dark, bx, -0.18, s * (SPEC.beamW / 2 + 0.34), car);
      [-0.8, 0.8].forEach(dx => cyl(0.3, 0.26, M.rubber, bx + dx, -0.25, s * (SPEC.beamW / 2 + 0.13), "y", car));
    });
    box(2.4, 0.16, 0.6, M.dark, bx, 0.05, 0, car);
    [-0.85, 0.85].forEach(dx => cyl(0.5, 0.34, M.rubber, bx + dx, 0.33, 0, "z", car));
  });
  // nose: headlights, destination sign, coupler
  const nose = (x, dir) => {
    const a = W * 0.62 / 2, top = SPEC.bodyTop - 0.95, bot = SPEC.bodyTop - 0.95 - 0;
    [-1, 1].forEach(k => { const l = new T.Mesh(new T.CylinderGeometry(0.16, 0.16, 0.06, 20), M.lamp); l.rotation.z = Math.PI / 2; l.position.set(x + dir * 0.03, 1.15, k * (a - 0.42)); car.add(l); });
    const sg = new T.Mesh(new T.BoxGeometry(0.05, 0.28, 1.3), M.sign); sg.position.set(x + dir * 0.03, top - 0.22, 0); car.add(sg);
    const plate = new T.Mesh(new T.BoxGeometry(0.05, 0.6, 1.1), M.skirt); plate.position.set(x + dir * 0.03, 0.95, 0); car.add(plate);
  };
  if (noseFront) nose(L, 1); if (noseRear) nose(0, -1);
  return car;
}

/* ---------- train ---------- */
const train = new T.Group(); scene.add(train);
{
  const lens = []; for (let i = 0; i < SPEC.cars; i++) lens.push(i === 0 || i === SPEC.cars - 1 ? SPEC.headLen : SPEC.midLen);
  const total = lens.reduce((a, b) => a + b, 0) + SPEC.gap * (SPEC.cars - 1); let x = -total / 2;
  lens.forEach((L, i) => {
    const car = buildCar(L, i === SPEC.cars - 1, i === 0); car.position.x = x; train.add(car);
    if (i < SPEC.cars - 1) {   // gangway bellows
      const gx = x + L + SPEC.gap / 2;
      box(SPEC.gap + 0.1, 2.9, W - 0.7, M.dark, gx, 2.15, 0, train);
      for (let k = -2; k <= 2; k++) box(0.04, 3.0, W - 0.6, M.skirt, gx + k * 0.11, 2.15, 0, train);
    }
    x += L + SPEC.gap;
  });
  train.userData.length = total;
}

/* ---------- beam, pillars, ground ---------- */
const BEAM_LEN = 600;
const beam = new T.Mesh(new T.BoxGeometry(BEAM_LEN, SPEC.beamH, SPEC.beamW), M.concrete); beam.position.set(0, -SPEC.beamH / 2, 0); beam.castShadow = beam.receiveShadow = true; scene.add(beam);
for (let x = -BEAM_LEN / 2 + SPEC.pillarEvery / 2; x < BEAM_LEN / 2; x += SPEC.pillarEvery) {
  const col = new T.Mesh(new T.CylinderGeometry(0.55, 0.7, SPEC.pillarH, 16), M.concrete); col.position.set(x, -SPEC.beamH - SPEC.pillarH / 2, 0); col.castShadow = true; scene.add(col);
  box(1.0, 0.5, 2.4, M.concrete, x, -SPEC.beamH - 0.25, 0, scene);
}
const groundY = -SPEC.beamH - SPEC.pillarH;
const ground = new T.Mesh(new T.PlaneGeometry(4000, 4000), M.ground); ground.rotation.x = -Math.PI / 2; ground.position.y = groundY; ground.receiveShadow = true; scene.add(ground);
const road = new T.Mesh(new T.PlaneGeometry(4000, 9), new T.MeshStandardMaterial({ color: 0x55575a, roughness: 0.95 })); road.rotation.x = -Math.PI / 2; road.position.set(0, groundY + 0.02, 14); road.receiveShadow = true; scene.add(road);
const buildMs = Math.round(performance.now() - t0);

/* ---------- views ---------- */
const V = {   // camera position / target relative to the train centre (the front nose is at x = +43.8)
  front3q: ["前から斜め", [70, 5.5, 30], [30, 2.4, 0]],
  side: ["真横", [20, 3.4, 62], [20, 2.4, 0]],
  rear3q: ["後ろから斜め", [-70, 6, -30], [-30, 2.4, 0]],
  lowfront: ["低い前", [62, 1.0, 12], [40, 2.4, 0]],
  top: ["真上", [10, 90, 0.01], [10, 0, 0]],
  nose: ["先頭のアップ", [58, 3.0, 9], [43, 2.3, 0]],
};
const vb = $("views");
Object.entries(V).forEach(([k, [label]]) => { const b = document.createElement("button"); b.textContent = label; b.dataset.k = k; b.onclick = () => setView(k); vb.appendChild(b); });
let follow = 0;
function setView(k) {
  const [, p, t] = V[k]; const o = train.position.x;
  cam.position.set(p[0] + o, p[1], p[2]); ctl.target.set(t[0] + o, t[1], t[2]); ctl.update(); follow = train.position.x;
}
const flag = (id, fn) => { const b = $(id); b.onclick = () => { b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); fn(b.getAttribute("aria-pressed") === "true"); }; return b; };
let running = false, wire = false;
flag("run", v => running = v);
flag("wire", v => { wire = v; Object.values(M).forEach(m => { if (m !== M.ground) m.wireframe = v; }); });
flag("orbit", v => { ctl.autoRotate = v; ctl.autoRotateSpeed = 1.2; });
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let tris = 0; train.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
$("stats").textContent = `三角形 ${Math.round(tris).toLocaleString()} ・ 組み立て ${buildMs} ms ・ 全長 ${train.userData.length.toFixed(1)} m`;

let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (running) { const dx = 8.5 * dt; train.position.x += dx; if (train.position.x > 200) train.position.x -= 400; cam.position.x += dx; ctl.target.x += dx; }
  ctl.update(); renderer.render(scene, cam);
})(performance.now());
window.TRAIN = { setView, setRun: v => { running = v; }, views: Object.keys(V), spec: SPEC, tris };
const h = /^#v=(\w+)/.exec(location.hash); setView(h && V[h[1]] ? h[1] : "front3q");
if (/[#&]run=1/.test(location.hash)) { running = true; $("run").setAttribute("aria-pressed", "true"); }
})();
</script>
