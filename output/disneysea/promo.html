<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark only">
<title>絵本の冒険 PV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cinzel+Decorative:wght@700&family=Kiwi+Maru:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
/* the stage is always 1920 x 1080 video pixels, scaled to fit the window */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0c0806}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
#vign{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(20,10,4,.42) 100%)}
#grainfx{opacity:.07;mix-blend-mode:overlay}
#flash{background:#fff7e6;opacity:0}
#black{background:#000;opacity:1}
#cap{position:absolute;left:0;right:0;bottom:118px;text-align:center;font:500 50px/1.4 "Kiwi Maru",serif;letter-spacing:.14em;color:#fff8ea;
  text-shadow:0 2px 3px rgba(40,20,5,.55),0 0 26px rgba(40,20,5,.55);opacity:0;white-space:nowrap}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(12,6,3,.72) 0%,rgba(12,6,3,.88) 70%);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
#end .title{font:700 132px/1 "Cinzel Decorative",Cinzel,serif;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff2c4 0%,#e9c46a 42%,#b0802f 58%,#f3d98f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,200,110,.35))}
#end .rule{width:520px;height:2px;margin:34px 0 30px;background:linear-gradient(90deg,rgba(233,196,106,0),#e9c46a,rgba(233,196,106,0))}
#end .tag{font:500 46px/1.5 "Kiwi Maru",serif;letter-spacing:.12em;color:#fff4de;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#end .url{margin-top:30px;font:600 40px/1 Cinzel,serif;letter-spacing:.06em;color:#f0d68e;text-transform:lowercase}
#end .credit{position:absolute;bottom:40px;font:400 22px/1.5 "Kiwi Maru",serif;letter-spacing:.08em;color:rgba(255,240,215,.7)}
#play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;border:0;background:#0c0806;color:#f0d68e;cursor:pointer;
  font:500 48px "Kiwi Maru",serif;letter-spacing:.14em}
#play small{font-size:26px;color:rgba(255,240,215,.6);letter-spacing:.08em}
#play[hidden]{display:none}
</style>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="fx" id="vign"></div>
  <canvas class="fx" id="grainfx" width="480" height="270"></canvas>
  <div id="cap"></div>
  <div id="end">
    <div class="title">Disney Adventure</div>
    <div class="rule"></div>
    <div class="tag">絵本をひらいて、ふたつのパークを 3D で冒険しよう。</div>
    <div class="url">tokyo-disneysea-3d.vercel.app</div>
    <div class="credit">地図データ © OpenStreetMap contributors ・ 国土地理院　／　個人制作の非公式ファンプロジェクト</div>
  </div>
  <div class="fx" id="flash"></div>
  <div class="fx" id="black"></div>
  <button id="play" hidden>▶ 絵本をひらく<small>音が出ます(約 50 秒)</small></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
// The promo film: a pop-up book on a candlelit desk opens, the camera dives through its paper curtains into the book, and travels
// a paper-craft world (the canal harbour, the volcano, the turning globe, a forest, the castle under fireworks); a match cut on the
// castle brings it back to the book, which closes on the title. Everything is drawn here, as in the mock's opening pop-up book.
// Time drives everything (PROMO.frameAt(ms)), so tools/promo/record.py can render it frame by frame; opened in a browser it plays live.
(async () => {
  "use strict";
  const q = new URLSearchParams(location.search), REC = q.has("record");
  const DUR = 50000;
  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%,-50%)`; };
  fit(); addEventListener("resize", fit);

  // every run paints the same pictures: a seeded random
  let seed = 20260929;
  Math.random = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const CAPS = [
    [0.9, 4.4, "ある夜、ふしぎな絵本がひらきました。"],
    [5.4, 9.0, "ページの中には、夢の王国。"],
    [9.3, 11.3, "さあ、絵本の中へ――"],
    [13.6, 17.8, "運河の港町を、ゴンドラとすすんで"],
    [21.6, 24.8, "火を噴く山を見あげ"],
    [25.6, 29.4, "まわる地球儀の広場をぬけて"],
    [31.2, 34.4, "森の小道の、その先に……"],
    [36.0, 40.0, "お城の空に、光の花がひらく。"],
  ];
  await Promise.all(["600 40px Cinzel", "700 40px 'Cinzel Decorative'"].map(f => document.fonts.load(f).catch(() => {}))
    .concat(document.fonts.load("500 40px 'Kiwi Maru'", CAPS.map(c => c[2]).join("") + $("end").textContent).catch(() => {})));
  let D = {};
  try { D = await (await fetch("mock_data.json")).json(); } catch (e) { /* the map page is painted without the park outlines */ }

  const T = THREE;
  const cv = $("cv");
  const big = REC || Math.min(innerWidth, innerHeight * 16 / 9) > 1100;
  const RW = big ? 1920 : 1280, RH = big ? 1080 : 720;
  const r = new T.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: REC });
  r.setPixelRatio(1); r.setSize(RW, RH, false); r.outputEncoding = T.sRGBEncoding;
  r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;

  // ---------------------------------------------------------------- paint: paper, watercolour washes, ink (as in the mock's pop-up book)
  const C = { navy: "#34445f", slate: "#5f7590", rose: "#b98a80", burg: "#7c3440", moss: "#6f7d4c", sage: "#9da67c", ochre: "#c79b55",
    gold: "#b8913f", terra: "#a45a40", cream: "#ecdfc0", stone: "#cdbfa5", sand: "#d8c29a", water: "#7797aa", waterD: "#4f7189", brown: "#6e4a30", ink: "#4a3526" };
  const canvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const tex = (c, rep) => { const t = new T.CanvasTexture(c); t.anisotropy = 8; t.encoding = T.sRGBEncoding; if (rep) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep, rep); } return t; };
  const lam = o => new T.MeshLambertMaterial(o);
  const shade = (hex, k) => { const c = new T.Color(hex); return "#" + (k < 0 ? c.lerp(new T.Color(0x20140a), -k) : c.lerp(new T.Color(0xfff8e8), k)).getHexString(); };
  const grain = (g, w, h, amt = 14) => {
    const d = g.getImageData(0, 0, w, h), p = d.data;
    for (let i = 0; i < p.length; i += 4) if (p[i + 3]) { const n = (Math.random() - 0.5) * amt; p[i] += n; p[i + 1] += n; p[i + 2] += n * 0.9; }
    g.putImageData(d, 0, 0);
  };
  const fibres = (g, w, h) => {
    g.strokeStyle = "rgba(120,90,50,.08)"; g.lineWidth = 1;
    for (let i = 0; i < w * h / 900; i++) { const x = Math.random() * w, y = Math.random() * h, a = Math.random() * 6.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 7, y + Math.sin(a) * 7); g.stroke(); }
  };
  const paper = (g, w, h, base = "#eee1c2") => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9; i++) { const x = Math.random() * w, y = Math.random() * h, rr = 10 + Math.random() * 40, f = g.createRadialGradient(x, y, 0, x, y, rr);
      f.addColorStop(0, "rgba(150,100,50,.07)"); f.addColorStop(1, "rgba(150,100,50,0)"); g.fillStyle = f; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
    fibres(g, w, h);
    const v = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
    v.addColorStop(0, "rgba(120,80,40,0)"); v.addColorStop(1, "rgba(120,80,40,.22)"); g.fillStyle = v; g.fillRect(0, 0, w, h);
    grain(g, w, h, 12);
  };
  const wash = (g, path, col, edge = true) => {
    const w = g.canvas.width, h = g.canvas.height;
    g.save(); path(); g.clip();
    g.globalAlpha = 0.92; g.fillStyle = col; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * w, y = Math.random() * h, rr = 12 + Math.random() * 70, b = g.createRadialGradient(x, y, 0, x, y, rr);
      b.addColorStop(0, Math.random() < 0.55 ? `rgba(255,248,230,${0.1 + Math.random() * 0.14})` : `rgba(60,35,20,${0.05 + Math.random() * 0.08})`);
      b.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = b; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    const lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, "rgba(255,250,235,.16)"); lg.addColorStop(1, "rgba(40,25,10,.1)");
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    g.restore();
    if (edge) { g.save(); path(); g.globalAlpha = 0.4; g.lineWidth = 5; g.strokeStyle = shade(col, -0.3); g.stroke(); g.restore(); }
  };
  const ink = (g, path, lw = 2.4) => {
    g.save(); g.strokeStyle = C.ink; g.lineJoin = g.lineCap = "round";
    path(); g.globalAlpha = 0.85; g.lineWidth = lw; g.stroke();
    g.translate(0.9, -0.7); path(); g.globalAlpha = 0.35; g.lineWidth = lw * 0.5; g.stroke();
    g.restore();
  };
  const sh = (g, path, col) => { wash(g, path, col); ink(g, path); };
  const hatch = (g, path, x0, y0, x1, y1, gap = 7, a = 0.28) => {
    g.save(); path(); g.clip(); g.strokeStyle = C.ink; g.globalAlpha = a; g.lineWidth = 1.2;
    for (let x = x0 - (y1 - y0); x < x1; x += gap) { g.beginPath(); g.moveTo(x, y1); g.lineTo(x + (y1 - y0) * 0.6, y0); g.stroke(); }
    g.restore();
  };
  const P = (g, pts) => () => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
  const R = (g, x, y, w, h) => () => { g.beginPath(); g.rect(x, y, w, h); };
  const O = (g, x, y, rx, ry = rx) => () => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.2832); };
  const spr = (stops, size = 64) => { const c = canvas(size, size), g = c.getContext("2d"), rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    stops.forEach(([o, s]) => rg.addColorStop(o, s)); g.fillStyle = rg; g.fillRect(0, 0, size, size); return tex(c); };
  const clamp = k => Math.min(1, Math.max(0, k)), eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const backOut = k => 1 + 3.4 * Math.pow(k - 1, 3) + 2.4 * Math.pow(k - 1, 2);
  const cast = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

  // cut-outs: the art, a cream paper margin with a tan edge, paper grain
  const cut = (W, H, art, res = 1024) => {
    const PX = Math.min(18, res / W, res / H), w = Math.round(W * PX), h = Math.round(H * PX);
    const a = canvas(w, h); art(a.getContext("2d"), w, h);
    const sil = col => { const c = canvas(w, h), g = c.getContext("2d"); g.drawImage(a, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = col; g.fillRect(0, 0, w, h); return c; };
    const out = canvas(w, h), g = out.getContext("2d"), rim = sil("#a88f66"), margin = sil("#f1e6cc");
    for (let i = 0; i < 16; i++) { const t = i / 16 * 6.2832; g.drawImage(rim, Math.cos(t) * 6.5, Math.sin(t) * 6.5); }
    for (let i = 0; i < 16; i++) { const t = i / 16 * 6.2832; g.drawImage(margin, Math.cos(t) * 5.5, Math.sin(t) * 5.5); }
    g.drawImage(a, 0, 0); grain(g, w, h, 10);
    return tex(out);
  };
  const piece = (W, H, art, res) => {
    const m = new T.Mesh(new T.PlaneGeometry(W, H), lam({ map: cut(W, H, art, res), alphaTest: 0.5, side: T.DoubleSide }));
    m.castShadow = m.receiveShadow = true; return m;
  };
  const tower = (g, x, base, bw, bh, rh, wall = C.cream, roof = C.navy) => {
    sh(g, R(g, x - bw / 2, base - bh, bw, bh), wall);
    hatch(g, R(g, x + bw * 0.15, base - bh, bw * 0.35, bh), x, base - bh, x + bw / 2, base, 6, 0.22);
    sh(g, O(g, x, base - bh * 0.6, bw * 0.12, bw * 0.2), C.brown);
    sh(g, P(g, [[x - bw * 0.62, base - bh], [x, base - bh - rh], [x + bw * 0.62, base - bh]]), roof);
    sh(g, O(g, x, base - bh - rh - 5, 5), C.gold);
  };
  const arts = {
    mountains(g, w, h) {
      const hills = () => { g.beginPath(); g.moveTo(0, h); g.bezierCurveTo(w * 0.1, h * 0.45, w * 0.2, h * 0.5, w * 0.32, h * 0.62);
        g.bezierCurveTo(w * 0.5, h * 0.4, w * 0.62, h * 0.35, w * 0.72, h * 0.5); g.bezierCurveTo(w * 0.82, h * 0.3, w * 0.94, h * 0.35, w, h * 0.55); g.lineTo(w, h); g.closePath(); };
      sh(g, hills, C.sage); hatch(g, hills, w * 0.5, h * 0.3, w, h, 9, 0.16);
      const volcano = P(g, [[w * 0.06, h], [w * 0.16, h * 0.5], [w * 0.2, h * 0.38], [w * 0.235, h * 0.3], [w * 0.26, h * 0.34], [w * 0.3, h * 0.29],
        [w * 0.33, h * 0.36], [w * 0.36, h * 0.46], [w * 0.4, h * 0.52], [w * 0.47, h]]);
      sh(g, volcano, C.terra); hatch(g, volcano, w * 0.26, h * 0.3, w * 0.47, h, 6, 0.3);
      g.save(); g.strokeStyle = C.ink; g.globalAlpha = 0.4; g.lineWidth = 1.6;
      for (const [a, b, c, d] of [[.18, .55, .23, .7], [.26, .45, .3, .66], [.34, .5, .38, .72], [.22, .78, .28, .9], [.12, .8, .16, .92]]) { g.beginPath(); g.moveTo(w * a, h * b); g.lineTo(w * c, h * d); g.stroke(); }
      g.restore();
      wash(g, P(g, [[w * 0.255, h * 0.34], [w * 0.27, h * 0.5], [w * 0.262, h * 0.64], [w * 0.249, h * 0.48]]), "#c46a3a", false);
    },
    smoke(g, w, h) {
      const puff = () => { g.beginPath(); for (const [x, y, rr] of [[0.35, 0.62, 0.3], [0.62, 0.45, 0.36], [0.5, 0.7, 0.26]]) { g.moveTo(w * x + h * rr, h * y); g.arc(w * x, h * y, h * rr, 0, 6.3); } };
      ink(g, puff, 3); wash(g, puff, "#e8dfcd", false);
    },
    castleBack(g, w, h) {
      const b = h - 4, dd = h * 0.2;
      tower(g, w * 0.5, b - h * 0.34 + dd, w * 0.14, h * 0.26 + dd, h * 0.26);
      tower(g, w * 0.33, b - h * 0.3 + dd, w * 0.1, h * 0.2 + dd, h * 0.18, C.cream, C.slate); tower(g, w * 0.67, b - h * 0.3 + dd, w * 0.1, h * 0.2 + dd, h * 0.18, C.cream, C.slate);
    },
    hillsBack(g, w, h) {
      const hills = () => { g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * 0.55); g.bezierCurveTo(w * 0.12, h * 0.2, w * 0.24, h * 0.3, w * 0.36, h * 0.45);
        g.bezierCurveTo(w * 0.5, h * 0.12, w * 0.64, h * 0.25, w * 0.76, h * 0.4); g.bezierCurveTo(w * 0.86, h * 0.2, w * 0.95, h * 0.3, w, h * 0.5); g.lineTo(w, h); g.closePath(); };
      sh(g, hills, "#93a79f"); hatch(g, hills, w * 0.3, h * 0.2, w, h, 10, 0.12);
    },
    foot(g, w, h) {
      const bumps = () => { g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * 0.5); for (let i = 0; i < 6; i++) g.quadraticCurveTo(w * (i + 0.5) / 6, h * (i % 2 ? 0.05 : 0.2), w * (i + 1) / 6, h * 0.55);
        g.lineTo(w, h); g.closePath(); };
      sh(g, bumps, C.moss); hatch(g, bumps, 0, h * 0.2, w, h, 8, 0.2);
    },
    castle(g, w, h) {
      const b = h - 4;
      tower(g, w * 0.14, b, w * 0.12, h * 0.44, h * 0.2); tower(g, w * 0.86, b, w * 0.12, h * 0.44, h * 0.2);
      for (let i = 0; i < 8; i++) sh(g, R(g, w * 0.2 + i * w * 0.075, b - h * 0.36 - 10, w * 0.045, 12), C.stone);
      const wall = R(g, w * 0.2, b - h * 0.36, w * 0.6, h * 0.36);
      sh(g, wall, C.stone); hatch(g, wall, w * 0.6, b - h * 0.36, w * 0.8, b, 7, 0.2);
      sh(g, () => { g.beginPath(); g.moveTo(w * 0.43, b); g.lineTo(w * 0.43, b - h * 0.15); g.arc(w * 0.5, b - h * 0.15, w * 0.07, Math.PI, 0); g.lineTo(w * 0.57, b); g.closePath(); }, C.burg);
      for (const x of [0.3, 0.7]) sh(g, O(g, w * x, b - h * 0.2, 7), C.gold);
    },
    harbor(g, w, h) {
      const cols = [C.ochre, C.rose, C.sand, "#a7b6b8", "#c9a3a0", C.sage, "#e0c79a"];
      tower(g, w * 0.8, h - 4, w * 0.07, h * 0.72, h * 0.14, C.sand, C.terra);
      let x = 6, i = 0;
      while (x < w - 10) {
        const bw = w * (0.1 + (i * 37 % 5) * 0.012), bh = h * (0.42 + (i * 53 % 7) * 0.06);
        if (x + bw > w * 0.76 && x < w * 0.84) { x = w * 0.84; continue; }
        const body = R(g, x, h - 4 - bh, bw, bh);
        sh(g, body, cols[i % cols.length]); hatch(g, body, x + bw * 0.6, h - 4 - bh, x + bw, h, 6, 0.18);
        sh(g, P(g, [[x - 4, h - 4 - bh], [x + bw / 2, h - 4 - bh - bw * 0.35], [x + bw + 4, h - 4 - bh]]), C.terra);
        for (let rr = 0; rr < 3; rr++) for (let c = 0; c < 2; c++) {
          const wy = h - 4 - bh + 14 + rr * (bh / 3.4); if (wy > h - 22) continue;
          wash(g, R(g, x + bw * (0.22 + c * 0.38), wy, bw * 0.18, bh * 0.12), C.navy, false);
        }
        x += bw + 2; i++;
      }
    },
    pedestal(g, w, h) {
      sh(g, O(g, w / 2, h - 16, w * 0.46, 12), C.stone);
      wash(g, O(g, w / 2, h - 19, w * 0.39, 8), C.water); ink(g, O(g, w / 2, h - 19, w * 0.39, 8), 1.6);
      const col = R(g, w * 0.42, h * 0.18, w * 0.16, h * 0.62);
      sh(g, col, C.stone); hatch(g, col, w * 0.5, h * 0.18, w * 0.58, h, 5, 0.25);
      sh(g, O(g, w / 2, h * 0.18, w * 0.2, 7), C.gold);
    },
    waves(g, w, h) {
      const n = 14, sw = w / n, sea = () => { g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * 0.4); for (let i = 0; i < n; i++) g.quadraticCurveTo(sw * i + sw / 2, h * (i % 2 ? 0.05 : 0.2), sw * (i + 1), h * 0.4); g.lineTo(w, h); g.closePath(); };
      sh(g, sea, C.water); hatch(g, sea, 0, h * 0.5, w, h, 8, 0.14);
      g.save(); g.strokeStyle = "#f3ead6"; g.lineWidth = 2.5; g.globalAlpha = 0.9;
      for (let i = 0; i < n; i++) { g.beginPath(); g.arc(sw * i + sw * 0.62, h * 0.44, sw * 0.14, Math.PI, Math.PI * 1.9); g.stroke(); }
      g.restore();

        const dusk = sstep(29.5, 35, t);
        skyDusk.material.opacity = dusk; stars.material.opacity = sstep(32.5, 36, t) * 0.95;
        sc.fog.color.copy(FOG_DAY).lerp(FOG_DUSK, dusk);
        hemi.intensity = 0.62 - 0.32 * dusk; hemi.color.setHex(0xfff1dc).lerp(new T.Color(0x7d86c0), dusk); hemi.groundColor.setHex(0x8a7a5c).lerp(new T.Color(0x3a2a3a), dusk);
        key.intensity = 0.95 - 0.62 * dusk; key.color.setHex(0xfff0d8).lerp(new T.Color(0xff9a6a), dusk);
        sunG.position.y = 240 - 200 * dusk; sun.rotation.z = t * 0.05;
        const f = cam.look; key.position.set(f.x - 80, 150, f.z + 90); key.target.position.set(f.x, 0, f.z);
        // pop-ups
        for (const p of pops) {
          const u = clamp((t - p.at) / p.dur), up = u > 0 ? backOut(u) : 0;
          p.hinge.visible = up > 0.002;
          if (p.kind === "flat") { p.inner.rotation.x = -Math.PI / 2 * (1 - up); if (p.yaw) p.inner.rotation.y = p.yaw * clamp(up); }
          else if (p.kind === "box") p.inner.scale.set(1, Math.max(up, 0.001), 1);
          else p.inner.scale.setScalar(Math.max(up, 0.001));
        }
        for (const p of seaRows) p.inner.position.set(Math.sin(t * 0.8 + p.ph) * 1.6, Math.sin(t * 1.3 + p.ph) * 0.35 - 0.3, 0);
        waterTex.offset.set(t * 0.01, t * 0.02);
        for (const g of gondolas) { g.g.position.x = g.x0 + g.v * (t - 11.5); g.g.position.y = 2.1 + Math.sin(t * 1.5 + g.ph) * 0.3; g.g.rotation.z = Math.sin(t * 1.5 + g.ph + 0.8) * 0.06; }
        for (const g of gulls) { const a = t * g.w + g.ph; g.g.position.set(g.cx + Math.cos(a) * g.r, g.y + Math.sin(t * 0.9 + g.ph) * 1.2, g.cz + Math.sin(a) * g.r);
          g.g.rotation.y = -a + (g.w > 0 ? 0 : Math.PI); const fl = Math.sin(t * 7 + g.ph) * 0.6; g.l.rotation.z = fl; g.rw.rotation.z = -fl; }
        for (const c of clouds) { c.g.position.x = c.x + Math.sin(t * 0.15 + c.ph) * 6; c.m.material.color.setScalar(1 - 0.7 * dusk); }
        // volcano
        for (const s of smokes) { s.m.position.y = s.y + Math.sin(t * 0.9 + s.ph) * 3; s.m.position.x = s.x + Math.sin(t * 0.6 + s.ph) * 2.4; s.m.scale.setScalar(1 + Math.sin(t * 1.3 + s.ph) * 0.06); }
        const E = clamp((t - ERUPT) / 0.4) * (1 - 0.5 * clamp((t - ERUPT) / 3)) + 0.18;
        for (let i = 0; i < VN; i++) {
          const s = vSeed[i], u = (t * 0.55 + s.o) % 1, aa = u * 2.2;
          if (s.o >= E) { vp.col[i * 3] = vp.col[i * 3 + 1] = vp.col[i * 3 + 2] = 0; continue; }
          vp.pos[i * 3] = CRATER.x + s.vx * aa; vp.pos[i * 3 + 1] = CRATER.y + s.vy * aa - 38 * aa * aa; vp.pos[i * 3 + 2] = CRATER.z + s.vz * aa;
          const k = Math.pow(1 - u, 1.2); vp.col[i * 3] = k; vp.col[i * 3 + 1] = (0.3 + 0.4 * s.g) * k; vp.col[i * 3 + 2] = 0.1 * k;
        }
        vp.done();
        lava.material.opacity = 0.85 * E * (0.8 + 0.2 * Math.sin(t * 9)); lava.scale.setScalar(40 + 25 * E + 8 * Math.sin(t * 7));
        // the globe and its fountain
        bigGlobe.rotation.y = t * 0.4; ringG.rotation.z = t * 0.2;
        for (let i = 0; i < FN; i++) { const s = fSeed[i], u = (t * 0.6 * s.v + s.o) % 1, a = s.a, rr = 14 - u * 11;
          fp.pos[i * 3] = G.x + Math.cos(a) * rr; fp.pos[i * 3 + 1] = 2.2 + Math.sin(u * Math.PI) * 7; fp.pos[i * 3 + 2] = G.z + Math.sin(a) * rr;
          const k = 0.55 * Math.sin(u * Math.PI); fp.col[i * 3] = 0.75 * k; fp.col[i * 3 + 1] = 0.9 * k; fp.col[i * 3 + 2] = k; }
        fp.done();
        // dusk lights: the castle, fireflies
        castleLight.intensity = 1.6 * dusk; for (const [i, s] of glows.entries()) s.material.opacity = dusk * clamp((t - 31.9) / 1.2) * (0.7 + 0.3 * Math.sin(t * 3 + i));
        for (let i = 0; i < FFN; i++) { const s = ffSeed[i], k = sstep(30, 33, t) * (0.5 + 0.5 * Math.sin(t * 2.3 + s.ph));
          ff.pos[i * 3] = s.x + Math.sin(t * s.s + s.ph) * 3; ff.pos[i * 3 + 1] = s.y + Math.sin(t * s.s * 1.3 + s.ph) * 1.5; ff.pos[i * 3 + 2] = s.z + Math.cos(t * s.s + s.ph) * 3;
          ff.col[i * 3] = k; ff.col[i * 3 + 1] = 0.85 * k; ff.col[i * 3 + 2] = 0.4 * k; }
        ff.done();
        drawSparks(fwp, fwList, t);
        FW.forEach(([t0, x, y], i) => {
          const a = t - t0;
          for (let j = 0; j < 6; j++) { const n = (i * 6 + j) * 3, aj = a - j * 0.035, on = aj > 0 && aj < 0.9;
            const k = on ? (1 - j / 6) * 0.9 : 0, e = eo(clamp(aj / 0.9));
            rockets.pos[n] = x + Math.sin(aj * 9) * 0.4; rockets.pos[n + 1] = on ? e * y : -999; rockets.pos[n + 2] = -212;
            rockets.col[n] = k; rockets.col[n + 1] = 0.8 * k; rockets.col[n + 2] = 0.5 * k; }
          const b = a - 0.9; fwFlash[i].material.opacity = b > 0 ? Math.exp(-b * 7) * 0.9 : 0;
        });
        rockets.done();
        let beat = 0; for (const [t0] of FW) { const b = t - t0 - 0.9; if (b > 0) beat += Math.exp(-b * 5); }
        castleLight.intensity += beat * 1.2; castleLight.color.setHex(0xffc27a);
      },
    };
  })();

  // ================================================================ the film: which scene, the overlays
  const decay = (t, at, a, k) => t < at ? 0 : a * Math.exp(-(t - at) * k);
  const capEl = $("cap"), flashEl = $("flash"), blackEl = $("black"), endEl = $("end");
  const grainC = $("grainfx"), gg = grainC.getContext("2d"), gImg = gg.createImageData(480, 270);
  let capNow = null;
  const V = T.Vector3;
  function frameAt(ms) {
    const t = ms / 1000;
    if (t < 11.5) {   // the book opens; from 9.4 s the camera dives through the curtains into the harbour
      const el = Math.max(0, ms - BOOK_OFS), v = book.view(el);
      let camera = v;
      if (t > 9.4) { const k = eio(clamp((t - 9.4) / 2.1));
        camera = { pos: v.pos.clone().lerp(new V(-4, 7.6, 12), k), look: v.look.clone().lerp(new V(-5, 6, -8), k), fov: 32 - 10 * k }; }
      book.step({ el, t, camera }); r.render(book.sc, book.cm);
    } else if (t < 41) {
      world.step(t); r.render(world.sc, world.cm);
    } else {   // match cut on the castle: out of the pop-up castle, the pop-ups fold, the book closes
      const u = t - 41, el = 30000;
      const close = { pos: new V(12, 16, 16), look: new V(12, 15, -7), fov: 34 }, v = book.view(el + u * 1000);
      const top = { pos: new V(0, 72, 46), look: new V(0, -1, 2), fov: 30 };
      const k1 = eio(clamp(u / 2.4)), k2 = eio(clamp((u - 2.2) / 2.4));
      const pos = close.pos.clone().lerp(v.pos, k1).lerp(top.pos, k2), look = close.look.clone().lerp(v.look, k1).lerp(top.look, k2);
      const push = sstep(4.6, 9, u);
      pos.lerp(top.look, 0.12 * push);
      const fov = close.fov + (v.fov - close.fov) * k1 + (top.fov - v.fov) * k2;
      const fold = clamp((u - 2.0) / 1.6), open = 1 - eio(clamp((u - 3.0) / 1.7));
      book.step({ el, t, open, fold, camera: { pos, look, fov } }); r.render(book.sc, book.cm);
    }
    // overlays
    blackEl.style.opacity = Math.max(1 - clamp(t / 1.0), sstep(49.2, 50, t));
    const fl = Math.max(decay(t, (book.BURST_AT + BOOK_OFS) / 1000, 0.5, 4), decay(t, (book.FIN_AT + BOOK_OFS) / 1000, 0.35, 4),
      t < 11.5 ? sstep(10.4, 11.5, t) : 1 - sstep(11.5, 12.5, t), decay(t, 31.9, 0.4, 3),
      t < 41 ? sstep(40.3, 41, t) : 1 - sstep(41, 41.9, t));
    flashEl.style.opacity = fl;
    const c = CAPS.find(c => t >= c[0] - 0.1 && t <= c[1] + 0.1);
    if (c !== capNow) { capNow = c; capEl.textContent = c ? c[2] : ""; }
    if (c) { const k = Math.min(sstep(c[0], c[0] + 0.6, t), 1 - sstep(c[1] - 0.6, c[1], t));
      capEl.style.opacity = k; capEl.style.transform = `translateY(${(1 - k) * 14}px)`; capEl.style.filter = `blur(${(1 - k) * 6}px)`; }
    else capEl.style.opacity = 0;
    const ek = sstep(45.4, 46.8, t); endEl.style.opacity = ek; endEl.style.transform = `scale(${1.04 - 0.04 * ek})`;
    // film grain
    const p = gImg.data; for (let i = 0; i < p.length; i += 4) { const n = Math.random() * 255; p[i] = p[i + 1] = p[i + 2] = n; p[i + 3] = 255; }
    gg.putImageData(gImg, 0, 0);
  }
  window.PROMO = { duration: DUR, frameAt, world };

  if (REC) { frameAt(0); document.body.dataset.ready = "1"; return; }
  // live: press to play, in time with the music if it is there
  const play = $("play"); play.hidden = false; frameAt(0);
  const audio = new Audio("promo/music.m4a");
  play.onclick = () => {
    play.hidden = true;
    let t0 = performance.now(), useAudio = false;
    audio.currentTime = 0; audio.play().then(() => { useAudio = true; }).catch(() => {});
    const tick = () => {
      const ms = useAudio && !audio.paused ? audio.currentTime * 1000 : performance.now() - t0;
      frameAt(Math.min(ms, DUR));
      if (ms < DUR) requestAnimationFrame(tick); else { play.hidden = false; play.firstChild.textContent = "▶ もういちど見る"; }
    };
    requestAnimationFrame(tick);
  };
})();
</script>
